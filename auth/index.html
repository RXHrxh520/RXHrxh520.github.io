<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>账号中心 · RXH</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<style>
  :root{--ink:#16181d;--sub:#606a78;--line:#e6e9ef;--card:#fff;--page:#f7f8fa;--soft:#f0f3ff;--brand:#3d63ff;--brand2:#7b5cff;--danger:#cf222e}
  @media (prefers-color-scheme:dark){:root{--ink:#e8ecf4;--sub:#98a3b5;--line:#242a36;--card:#161a23;--page:#0f1117;--soft:#1a2030}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;padding:26px 16px 40px;display:grid;place-items:center;
    background:radial-gradient(1000px 480px at 50% -10%,var(--soft),var(--page) 60%);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{width:min(430px,100%)}
  .brand{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.16em;color:var(--sub);text-transform:uppercase}
  .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:13px;box-shadow:0 6px 16px rgba(61,99,255,.26)}
  h1{font-size:24px;letter-spacing:-.02em;margin:18px 0 0}
  .card{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;
    box-shadow:0 24px 60px -36px rgba(22,24,29,.3)}
  .tabs{display:flex;gap:6px;background:var(--page);border-radius:12px;padding:4px}
  .tab{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer}
  .tab.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(22,24,29,.08)}
  .field{margin-top:13px}
  .field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px}
  .field input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 13px;background:var(--page);
    color:var(--ink);font-size:14px;outline:none;transition:border-color .18s,box-shadow .18s}
  .field input:focus{border-color:#b9c6ff;box-shadow:0 0 0 4px rgba(61,99,255,.1)}
  .btn{margin-top:16px;width:100%;height:46px;border:0;border-radius:12px;cursor:pointer;color:#fff;font-size:15px;font-weight:650;
    background:linear-gradient(120deg,var(--brand),var(--brand2));box-shadow:0 12px 26px -14px rgba(61,99,255,.8)}
  .btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
  .tsbox{margin-top:16px;min-height:68px;display:flex;justify-content:center}
  .agree{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:12px;color:var(--sub);line-height:1.6}
  .agree input{margin-top:2px}
  .agree a{color:var(--brand);cursor:pointer;text-decoration:none}
  .msg{margin-top:12px;font-size:12.5px;line-height:1.6;min-height:18px}
  .msg.err{color:var(--danger)}
  .msg.ok{color:#1a7f37}
  .foot{margin-top:18px;text-align:center;font-size:12px;color:var(--sub)}
  .foot a{color:var(--sub)}
  .modal{position:fixed;inset:0;background:rgba(10,12,20,.42);display:none;place-items:center;padding:20px;z-index:50}
  .modal.on{display:grid}
  .sheet{background:var(--card);border-radius:18px;width:min(560px,100%);max-height:82vh;overflow:auto;padding:22px 20px;position:relative}
  .sheet h2{margin:0 0 10px;font-size:17px}
  .sheet h3{margin:18px 0 6px;font-size:14px}
  .sheet p,.sheet li{font-size:13px;line-height:1.75;color:var(--sub);margin:6px 0}
  .sheet ul{padding-left:18px;margin:6px 0}
  .x{position:absolute;right:12px;top:12px;width:32px;height:32px;border:0;background:transparent;border-radius:9px;cursor:pointer;color:#98a1b0}
  .x:hover{background:var(--soft);color:var(--ink)}
  .banner{display:none;margin-bottom:12px;font-size:12.5px;padding:10px 12px;border-radius:10px;background:#fff8e6;color:#8a5a00;border:1px solid #ffe2b0}
  .banner.on{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="mark">R</span> RXH ACCOUNT</div>
  <h1>账号中心</h1>

  <div class="card">
    <div class="banner" id="noticeBar"></div>

    <div class="tabs">
      <button class="tab on" data-tab="login">登录</button>
      <button class="tab" data-tab="reg">注册</button>
    </div>

    <form id="loginForm">
      <div class="field"><label for="la">账号（邮箱或 ID）</label><input id="la" autocomplete="username" placeholder="请输入账号、邮箱或用户 ID"></div>
      <div class="field"><label for="lp">密码</label><input id="lp" type="password" autocomplete="current-password" placeholder="请输入您的密码"></div>
      <button class="btn" id="loginBtn" type="submit" disabled>登录</button>
      <div class="msg" id="loginMsg"></div>
    </form>

    <form id="regForm" hidden>
      <div class="field"><label for="re">邮箱</label><input id="re" type="email" autocomplete="email" placeholder="请输入您的邮箱"></div>
      <div class="field"><label for="rn">昵称（可选）</label><input id="rn" maxlength="32" placeholder="请输入昵称（可留空）"></div>
      <div class="field"><label for="rp">密码</label><input id="rp" type="password" autocomplete="new-password" placeholder="请设置至少 8 位密码"></div>
      <div class="field"><label for="rg">性别</label><select id="rg"><option value="0">男</option><option value="1">女</option></select></div>
      <div class="field"><label for="ri">邀请码</label><input id="ri" placeholder="请输入邀请码" autocapitalize="characters"></div>
      <button class="btn" id="regBtn" type="submit" disabled>注册</button>
      <div class="msg" id="regMsg"></div>
    </form>

    <div class="tsbox" id="tsBox"></div>

    <label class="agree">
      <input type="checkbox" id="agree">
      <span>我已阅读并同意 <a data-doc="terms">《用户协议》</a> 与 <a data-doc="privacy">《隐私政策》</a></span>
    </label>

    <div class="foot"><a href="https://www.rxh.asia/">← 返回总站</a></div>
  </div>
</div>

<div class="modal" id="docModal">
  <div class="sheet">
    <button class="x" id="docX">✕</button>
    <div id="docBody"></div>
  </div>
</div>

<div class="modal" id="banModal">
  <div class="sheet">
    <button class="x" id="banX">✕</button>
    <h2>账号已被封禁</h2>
    <p id="banLine"></p>
    <p style="font-size:12px">如有疑问，请通过总站公布的联系方式申诉。</p>
  </div>
</div>

<script>
window.TURNSTILE_SITEKEY = "0x4AAAAAAGPRu0xFiTmg5BYn";
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
<script src="app.js?v=7e89aa63" defer></script>
</body>
</html>
