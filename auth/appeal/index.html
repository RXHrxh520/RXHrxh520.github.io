<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="https://www.rxh.asia/assets/icons.js?v=1"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>封禁申诉 · rxh.asia</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(800px 500px at 12% -10%,rgba(255,122,184,.16),transparent 65%),linear-gradient(165deg,#0a0d16,#0d1224 50%,#0a0d16);color:#eef1fb;font:14.5px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:520px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.055);border-radius:20px;padding:26px 24px;backdrop-filter:blur(14px)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.back{font-size:12.5px;color:#98a2bd;text-decoration:none;border:1px solid rgba(255,255,255,.11);padding:6px 11px;border-radius:9px}
.back:hover{color:#eef1fb}
.brand{font-size:11.5px;letter-spacing:.1em;color:#98a2bd}
h1{margin:0;font-size:19px}
p.sub{margin:6px 0 0;font-size:12.5px;color:#98a2bd;line-height:1.7}
label{display:block;font-size:12px;color:#98a2bd;margin:14px 0 6px}
input,textarea{width:100%;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);color:#eef1fb;border-radius:11px;padding:10px 12px;font:inherit;font-size:13.5px;outline:none}
input:focus,textarea:focus{border-color:rgba(255,122,184,.55);background:rgba(255,255,255,.08)}
textarea{min-height:110px;resize:vertical}
.count{font-size:11.5px;color:#98a2bd;text-align:right;margin-top:4px}
.btn{width:100%;margin-top:16px;height:44px;border:0;border-radius:11px;background:linear-gradient(135deg,#ff7ab8,#b45cff);color:#140e1e;font-weight:700;font-size:14px;cursor:pointer}
.btn[disabled]{opacity:.55}
.msg{margin-top:12px;font-size:12.5px;min-height:18px;color:#98a2bd}
.msg.ok{color:#37e0a0}.msg.err{color:#ff6470}
.tip{margin-top:14px;font-size:11.5px;color:#98a2bd;line-height:1.7;border-top:1px solid rgba(255,255,255,.09);padding-top:12px}
</style>
<link rel="icon" href="https://github.com/RXHrxh520.png?size=64">
<style id="brand-avatar-css">
.mark img,.logo img,.ds-mark img,.logo .mark img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.brand .brand-ava{width:26px;height:26px;border-radius:8px;object-fit:cover;display:block;flex:0 0 26px}
.brand-ava{width:22px;height:22px;border-radius:7px;object-fit:cover;display:block}
</style>
</head>
<body>
<div class="card">
  <div class="top"><a class="back" href="https://auth.rxh.asia/">← 返回登录</a><span class="brand"><img class="brand-ava" src="https://github.com/RXHrxh520.png?size=64" alt="">rxh.asia · 账号申诉</span></div>
  <h1>账号封禁申诉</h1>
  <p class="sub">请填写可联系到你的邮箱与申诉理由。提交后管理员会人工复核，不支持上传附件。</p>

  <label for="uid">账号 ID（可选）</label>
  <input id="uid" placeholder="例如 R-020260003810">
  <label for="email">联系邮箱</label>
  <input id="email" type="email" placeholder="you@example.com">
  <label for="reason">申诉理由</label>
  <textarea id="reason" maxlength="300" placeholder="请说明情况，最多 300 字"></textarea>
  <div class="count"><span id="cnt">0</span>/300</div>
  <button class="btn" id="go">提交申诉</button>
  <div class="msg" id="m"></div>
  <div class="tip">申诉记录保留 7 天，到期自动删除；同一账号请勿重复提交。</div>
</div>
<script>
const $=s=>document.querySelector(s);
const r=$("#reason");
r.addEventListener("input",()=>$("#cnt").textContent=r.value.length);
$("#go").addEventListener("click",async()=>{
  const m=$("#m"), uid=$("#uid").value.trim().toUpperCase(), email=$("#email").value.trim(), reason=r.value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return (m.className="msg err",m.textContent="请填写正确的邮箱");
  if(reason.length<5) return (m.className="msg err",m.textContent="申诉理由至少 5 个字");
  if(reason.length>300) return (m.className="msg err",m.textContent="申诉理由最多 300 字");
  $("#go").disabled=true;
  try{
    const res=await fetch("https://auth.rxh.asia/api/appeal",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({uid,email,reason})});
    const d=await res.json();
    if(!d.ok) throw new Error(d.error||"提交失败");
    m.className="msg ok"; m.textContent="申诉已提交，我们会在 7 天内处理并清理记录。";
    $("#go").textContent="已提交"; $("#go").disabled=true;
  }catch(e){ m.className="msg err"; m.textContent=e.message||"提交失败，请稍后重试"; $("#go").disabled=false; }
});
</script>
</body>
</html>
