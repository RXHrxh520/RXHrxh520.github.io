<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="https://github.com/RXHrxh520.png?size=64">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>系统状态 · rxh.asia</title>
<meta name="description" content="rxh.asia 站点群实时运行状态与历史可用率。">
<meta name="robots" content="index,follow">
<style>
:root{
  --bg:#f5f6f8;--card:#ffffff;--card2:#fbfcfd;--line:#e6e8ee;--line2:#eff1f5;
  --ink:#171a21;--sub:#626a78;--mute:#9aa2b1;
  --green:#16a34a;--green-bg:#ecfdf3;--green-line:#bbf7d0;
  --amber:#b45309;--amber-bg:#fffbeb;--amber-line:#fde68a;
  --red:#dc2626;--red-bg:#fef2f2;--red-line:#fecaca;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.04);
}
body[data-theme="dark"]{
  --bg:#0d1017;--card:#151922;--card2:#181d27;--line:#252b36;--line2:#1e242e;
  --ink:#e9edf4;--sub:#98a2b3;--mute:#6b7480;
  --green:#4ade80;--green-bg:#12271a;--green-line:#1f5133;
  --amber:#fbbf24;--amber-bg:#2a2110;--amber-line:#4d3a12;
  --red:#f87171;--red-bg:#2a1414;--red-line:#502020;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.page{max-width:1040px;margin:0 auto;padding:0 24px 56px}
.top{height:72px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.02em}
.brand b{font-size:15.5px;letter-spacing:-.01em}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.brand i{font-style:normal;color:var(--mute);font-size:12.5px;margin-left:8px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.ta{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);color:var(--sub);font-size:12.5px;background:var(--card);transition:.16s}
.ta:hover{color:var(--ink);background:var(--card2)}
.ta svg{width:14px;height:14px}
.hero{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px 28px;display:flex;align-items:center;gap:18px}
.hicon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto}
.hicon.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-line)}
.hicon.warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-line)}
.hicon.bad{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)}
.hicon.loading{background:var(--card2);color:var(--mute);border:1px solid var(--line)}
.hicon svg{width:24px;height:24px}
.hero-copy h1{margin:0;font-size:27px;line-height:1.2;letter-spacing:-.03em;font-weight:750}
.hero-copy p{margin:7px 0 0;color:var(--sub);font-size:13px}
.hero-meta{margin-left:auto;text-align:right;flex:0 0 auto}
.live{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--sub);font-size:11.5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.hero-meta .next{display:block;margin-top:8px;color:var(--mute);font-size:11.5px;font-variant-numeric:tabular-nums}
.block{margin-top:34px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 12px}
.sec-head h2{margin:0;font-size:16px;letter-spacing:-.01em;font-weight:700}
.sec-head span{color:var(--mute);font-size:12px}
.sec-head .right{margin-left:auto}
.groups{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.group-h{display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--card2);border-bottom:1px solid var(--line2);color:var(--sub);font-size:11.5px;letter-spacing:.04em}
.group-h:first-child{padding-top:14px}
.svc{padding:15px 20px 14px;border-bottom:1px solid var(--line2);display:grid;grid-template-columns:1fr 74px;column-gap:18px;transition:background .16s}
.svc:last-child{border-bottom:0}
.svc:hover{background:var(--card2)}
.svc-main{min-width:0}
.svc-name{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:650;letter-spacing:-.01em}
.tag{font-weight:500;font-size:10.5px;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 5px;line-height:17px}
.svc-url{display:block;margin-top:2px;color:var(--mute);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc-right{text-align:right;align-self:start}
.svc-right b{display:block;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.svc-right b.ok{color:var(--green)}.svc-right b.warn{color:var(--amber)}.svc-right b.bad{color:var(--red)}
.svc-right span{display:block;color:var(--mute);font-size:10.5px;margin-top:1px}
.bar{grid-column:1/-1;display:flex;gap:2px;margin-top:10px;height:10px}
.seg{flex:1;border-radius:2px;background:#e8ebf0;min-width:1px}
.seg.ok{background:var(--green)}.seg.warn{background:var(--amber)}.seg.bad{background:var(--red)}
.seg.null{background:#e8ebf0}
body[data-theme="dark"] .seg.null{background:#2a3140}
.svc-foot{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;color:var(--mute);font-size:11px}
.svc-foot .st{color:var(--sub)}
.svc-foot .st.ok{color:var(--green)}.svc-foot .st.warn{color:var(--amber)}.svc-foot .st.bad{color:var(--red)}
.inc-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.inc{display:grid;grid-template-columns:64px 1fr;gap:16px;padding:17px 20px;border-bottom:1px solid var(--line2)}
.inc:last-child{border-bottom:0}
.inc-date{color:var(--mute);font-size:11px;line-height:1.3;padding-top:2px}
.inc-date b{display:block;font-size:19px;color:var(--ink);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.inc-title{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:650}
.badge{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--green-line);background:var(--green-bg);color:var(--green)}
.badge.open{border-color:var(--red-line);background:var(--red-bg);color:var(--red)}
.inc p{margin:5px 0 0;color:var(--sub);font-size:12.5px;line-height:1.65}
.inc-time{margin-top:6px;color:var(--mute);font-size:11px;font-variant-numeric:tabular-nums}
.empty{padding:26px 20px;color:var(--mute);font-size:12.5px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px 16px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);color:var(--mute);font-size:11px;text-align:center;padding-bottom:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{height:36px;border-radius:7px;display:grid;place-items:center;position:relative;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.cal-cell.in{color:var(--sub)}
.cal-cell.today{background:var(--red-bg);color:var(--red);font-weight:700;box-shadow:inset 0 0 0 1px var(--red-line)}
.cal-cell .evd{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--red)}
.cal-cell.today .evd{display:block;background:#fff}
.cal-legend{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2);color:var(--mute);font-size:11px}
.cal-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.foot{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);color:var(--mute);font-size:11.5px}
.social-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px 10px;margin-bottom:14px}
.s-item{display:flex;align-items:center;gap:8px;min-width:0;padding:7px 6px;border-radius:9px;text-align:left;color:var(--ink);transition:background .16s ease}
.s-item:hover{background:var(--line2)}
.s-ico{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:9px;background:var(--line2);color:var(--sub);overflow:hidden}
.s-ico svg{width:16px;height:16px;fill:currentColor;stroke:none}
.s-ico img{width:15px;height:15px;object-fit:contain}
.s-txt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.s-txt b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-txt i{font-style:normal;font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-item.ks .s-ico{color:#ff5000}
.s-item.bili .s-ico{color:#00a1d6}
.s-item.tg .s-ico{color:#229ed9}
.s-item.ge .s-ico{color:#c71d23}
.s-item.qq .s-ico{color:#12b7f5}
.s-item.mail .s-ico{color:#ff5fa2}
.s-item.mail .s-ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.1}
body[data-theme="light"] .s-item.dy .s-ico,body[data-theme="light"] .s-item.x .s-ico,body[data-theme="light"] .s-item.gh .s-ico{color:#171a21}
body[data-theme="dark"] .s-item.dy .s-ico,body[data-theme="dark"] .s-item.x .s-ico,body[data-theme="dark"] .s-item.gh .s-ico{color:#eef1fb}
@media(max-width:720px){.social-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.foot-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.foot .back{margin-left:auto;color:var(--sub)}
.foot .back:hover{color:var(--ink)}
@media(max-width:640px){
 .page{padding:0 14px 36px}
 .top{height:62px}
 .brand i{display:none}
 .top-actions .ta.hide{display:none}
 .hero{padding:20px;gap:14px;align-items:flex-start}
 .hicon{width:40px;height:40px;border-radius:12px}
 .hero-copy h1{font-size:20px}
 .hero-meta{display:none}
 .svc{padding:14px 14px 13px;grid-template-columns:1fr 64px;column-gap:10px}
 .group-h,.inc{padding-left:14px;padding-right:14px}
 .inc{grid-template-columns:48px 1fr;gap:10px}
 .bar{gap:1px}
}

.seg.minor{background:var(--amber)}
.seg.major{background:#d97706}
.svc-right b.minor{color:var(--amber)}
.svc-right b.major{color:#d97706}
.svc-foot .st.minor{color:var(--amber)}
.svc-foot .st.major{color:#d97706}
.svc-foot .st.bad{color:var(--red)}
.cal-cell[data-ev="1"]{cursor:pointer}
.cal-cell.flash{outline:2px solid var(--red);outline-offset:2px}
.svc-legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 2px 0;color:var(--mute);font-size:11px}
.svc-legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:1px}
</style>
</head>
