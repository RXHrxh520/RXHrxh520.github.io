<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>系统状态 · 软小寒</title>
<meta name="description" content="rxh.asia 各服务可用性状态，由 Cloudflare 边缘节点每 5 分钟主动探测。">
<style>
:root{
  --bg:#ffffff;--bg2:#f6f8fa;--card:#ffffff;--line:#d0d7de;--line2:#eaeef2;
  --ink:#1f2328;--sub:#59636e;--link:#0969da;
  --ok:#1a7f37;--ok-soft:#2da44e;--okbg:#dafbe1;
  --warn:#9a6700;--warn-soft:#d4a72c;--warnbg:#fff8c5;
  --bad:#cf222e;--bad-soft:#cf222e;--badbg:#ffebe9;
  --bar-empty:#eaeef2;
}
html.dark{
  --bg:#0d1117;--bg2:#161b22;--card:#161b22;--line:#30363d;--line2:#21262d;
  --ink:#e6edf3;--sub:#8b949e;--link:#4493f8;
  --ok:#3fb950;--ok-soft:#3fb950;--okbg:#12261a;
  --warn:#d29922;--warn-soft:#bb8009;--warnbg:#2b2110;
  --bad:#f85149;--bad-soft:#f85149;--badbg:#2d1214;
  --bar-empty:#21262d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}
.topbar{border-bottom:1px solid var(--line2);background:var(--bg2)}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:56px}
.logo{font-weight:700;font-size:15px}
.logo span{color:#ff4f86}
.nav{display:flex;gap:18px;font-size:13.5px}
.nav a{color:var(--sub)}.nav a:hover{color:var(--ink);text-decoration:none}
.spacer{flex:1}
.tools{display:flex;gap:8px}
.tbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;
  padding:6px 12px;font-size:12.5px;cursor:pointer}
.tbtn:hover{border-color:#8c959f}
.tbtn:disabled{opacity:.55;cursor:default}
main{padding:40px 0 56px}
h1{margin:0;font-size:30px;letter-spacing:-.5px}
.lead{margin:8px 0 0;color:var(--sub);font-size:13.5px}

.banner{margin:24px 0 26px;padding:24px 28px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  display:flex;align-items:center;gap:18px}
.bicon{width:52px;height:52px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;flex:0 0 auto}
.bicon.warn{background:var(--warnbg);color:var(--warn)}
.bicon.bad{background:var(--badbg);color:var(--bad)}
.bicon svg{width:26px;height:26px}
.btext b{display:block;font-size:19px;letter-spacing:-.2px}
.btext span{display:block;margin-top:3px;font-size:12.5px;color:var(--sub)}
.bmeta{margin-left:auto;text-align:right;font-size:12px;color:var(--sub);line-height:1.9;white-space:nowrap}

.group{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;margin-bottom:18px}
.group-h{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;
  border-bottom:1px solid var(--line2);background:var(--bg2);font-size:12.5px;color:var(--sub)}
.group-h b{color:var(--ink);font-size:13.5px}
.comp{padding:16px 20px;border-bottom:1px solid var(--line2)}
.comp:last-child{border-bottom:0}
.comp-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.nm{font-size:14.5px;font-weight:600}
.url{font-size:11.5px;color:var(--sub);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.ping{margin-left:auto;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--sub)}
.ping b{color:var(--ink);font-size:14px}
.st{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px}
.st.ok{color:var(--ok);background:var(--okbg)}
.st.warn{color:var(--warn);background:var(--warnbg)}
.st.bad{color:var(--bad);background:var(--badbg)}
.st.empty{color:var(--sub);background:var(--bg2)}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--sub)}
.err{margin-top:9px;padding:7px 10px;border-radius:6px;background:var(--badbg);color:var(--bad);
  font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.bars{display:flex;gap:2px;margin-top:12px;height:26px;align-items:stretch}
.bars i{flex:1;border-radius:2px;background:var(--bar-empty)}
.bars i.ok{background:var(--ok-soft)}
.bars i.warn{background:var(--warn-soft)}
.bars i.bad{background:var(--bad-soft)}
.recent{display:flex;gap:3px;margin-top:8px}
.recent i{width:8px;height:8px;border-radius:2px;background:var(--ok-soft)}
.recent i.bad{background:var(--bad-soft)}
.recent i.slow{background:var(--warn-soft)}
.bars-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:6px}

.legend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line2);
  background:var(--bg2);font-size:11.5px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{width:9px;height:9px;border-radius:2px;background:var(--ok-soft);display:inline-block}
.legend em.warn{background:var(--warn-soft)}.legend em.bad{background:var(--bad-soft)}.legend em.empty{background:var(--bar-empty)}

.inc{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.inc-h{display:flex;justify-content:space-between;padding:12px 20px;background:var(--bg2);
  border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--sub)}
.inc-h b{color:var(--ink);font-size:13.5px}
.inc-body{padding:16px 20px;font-size:13px;color:var(--sub)}
.inc-item{padding:12px 20px;border-bottom:1px solid var(--line2);font-size:13px}
.inc-item:last-child{border-bottom:0}
.inc-item b{display:block;font-size:13.5px}
.inc-item i{color:var(--sub);font-style:normal;font-size:11.5px}
.inc-item code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--bad)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px;font-size:12px;color:var(--sub)}
@media(max-width:640px){
  .topbar .nav{display:none}
  .banner{flex-wrap:wrap}
  .bmeta{margin-left:0;text-align:left;width:100%}
  .comp-top .url{width:100%}
  .ping{margin-left:0;width:100%}
}
</style>
</head>
<body>

<div class="topbar"><div class="wrap">
  <div class="logo">软小寒<span> · </span>status</div>
  <div class="nav"><a href="https://www.rxh.asia/">总站</a><a href="https://open.rxh.asia/">开放平台</a></div>
  <div class="spacer"></div>
  <div class="tools">
    <button class="tbtn" id="themeBtn">暗夜</button>
    <button class="tbtn" id="runBtn">立即探测</button>
  </div>
</div></div>

<main class="wrap">
  <h1>系统状态</h1>
  <p class="lead">探测由 Cloudflare 边缘节点每 5 分钟主动发起，与你所在网络无关，各设备看到的结果一致。延迟（Ping）为主指标，可用率为辅。</p>

  <div class="banner" id="banner">
    <div class="bicon" id="bicon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12.5l5 5 11-11"/></svg>
    </div>
    <div class="btext"><b id="bTitle">正在读取状态…</b><span id="bSub">连接边缘节点</span></div>
    <div class="bmeta">最近探测 <span id="lastTime">—</span><br>下次自动 <span id="nextTime">—</span></div>
  </div>

  <div class="group">
    <div class="group-h"><b>服务组件</b><span>下方条带为最近 90 天可用率</span></div>
    <div id="rows"><div class="comp"><div class="inc-body">正在获取数据…</div></div></div>
    <div class="legend">
      <span><em></em>正常</span>
      <span><em class="warn"></em>偏慢 / 降级</span>
      <span><em class="bad"></em>中断</span>
      <span><em class="empty"></em>无记录</span>
      <span style="margin-left:auto">每格为一天</span>
    </div>
  </div>

  <div class="inc">
    <div class="inc-h"><b>故障记录</b><span id="incCount">最近 10 条</span></div>
    <div id="incBody"><div class="inc-body">暂无故障记录。</div></div>
  </div>

  <div class="foot">
    <span>边缘主动探测 · Cloudflare Workers Cron · D1 持久化 · 每 5 分钟一次</span>
    <span><a href="https://www.rxh.asia/">← 返回总站</a> · 2026</span>
  </div>
</main>


<script src="app.js?v=2f33bb43" defer></script>
<script src="https://www.rxh.asia/assets/notice-bar.js?v=20261124" defer></script>
</body>
</html>
